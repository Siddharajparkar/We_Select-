name: Rollback Container App

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to rollback to (e.g. sha-abcdef or v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback assess-api
    runs-on: ubuntu-latest
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App Image
        run: |
          az containerapp update \
            --name assess-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/assess-api:${{ inputs.image_tag }}"
