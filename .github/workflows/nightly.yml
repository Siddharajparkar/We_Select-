name: Nightly Maintenance & Smoke Tests

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-fast:
    name: Nightly Fast Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev
          pip install -r api/requirements-dev.txt

      - name: Run all tests (no SQL Server)
        run: pytest tests -m "not sql"

  nightly-azure:
    name: Nightly Azure Smoke (when enabled)
    needs: nightly-fast
    runs-on: ubuntu-latest
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Container App Status
        run: |
          az containerapp show \
            --name assess-api \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name,provisioningState:properties.provisioningState,fqdn:properties.configuration.ingress.fqdn}" -o json
