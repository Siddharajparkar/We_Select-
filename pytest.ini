[pytest]
pythonpath = api tests
testpaths = tests
addopts = -rfE -q --strict-markers
markers =
    sql: needs a real SQL Server (set TEST_DATABASE_URL); skipped otherwise
    e2e: starts a real uvicorn process
    container: runs the built Docker image (CI only; needs E2E_IMAGE and a DB)
    azurite: needs Azurite (AZURITE_CONNECTION_STRING)
filterwarnings =
    ignore::DeprecationWarning
